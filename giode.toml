# Project file for the giode CLI (github.com/xmhrnx/giode-cli).
#
#   giode run                   build and run on this computer
#   giode build desktop         this computer's packages
#   giode build dmg             macOS: the app in a disk image
#   giode build windows-installer
#   giode build deb             (and linux, rpm, appimage)
#
# GoPlay draws video under its UI with Giode's underlay and OpenGL, and
# links libmpv with cgo; [native] bundles libmpv and what it loads. On
# Windows the CLI bundles ANGLE too (renderer = "opengl"); libmpv goes in
# build/native first (see the README).

[app]
name = "GoPlay"
id = "com.mehran9675.goplay"
version = "1.1.0"
build = 2
icon = "assets/icon.png"
splash_color = "#09090b"
package = "."
# Desktop only: libmpv (through cgo), its OpenGL render API under Giode's
# underlay, and desktop dialogs. Android and iOS would need another engine.
platforms = ["macos", "windows", "linux"]
publisher = "Mehran Zahiroddini"
description = "A fast, beautiful video player that plays almost anything."
website = "https://xmhrnx.github.io/goplay/"
renderer = "opengl"
ldflags = "-X github.com/mehran9675/goplay/internal/app.Version={version}"

[macos]
min_os = 11

[macos.usage]
local_network = "GoPlay looks for Chromecast and DLNA devices on your network so you can cast to them."

[macos.plist]
LSApplicationCategoryType = "public.app-category.video"   # the Mac App Store requires it
NSBonjourServices = ["_googlecast._tcp"]
# Only HTTPS and other standard protocols, through macOS and libmpv/FFmpeg
# (for streams): no export documentation needed for each upload.
ITSAppUsesNonExemptEncryption = false

# The Mac App Store build (giode build mas). The release workflow writes
# the profile from the MACOS_PROFILE_BASE64 secret and points
# $GIODE_MACOS_STORE_PROFILE at it; keep the file out of git.
# In the sandbox GoPlay plays what the user opens (files, folders, links)
# but can't run yt-dlp or FFmpeg; see RELEASING.md.
[macos.store]
entitlements = [
  "network.client",                 # streams, web links, Chromecast and DLNA control, network media servers
  "network.server",                 # the HTTP server casting devices fetch local files from; SSDP replies
  "files.user-selected.read-only",  # files and folders opened, dropped or chosen in Open Folder
  "assets.pictures.read-write",     # screenshots go to Pictures
  "cs.allow-jit",                   # libmpv's LuaJIT (its built-in scripts), as in the Developer ID build
]

# PrivacyInfo.xcprivacy for the Mac App Store. GoPlay sends nothing to its
# developer: no accounts, analytics, crash reports or tracking.
[privacy]
tracking = false

[windows]
arch = "amd64"
cc = "cc"

[windows.installer]
per_machine = false
desktop_shortcut = true
# Casting: TVs and Chromecasts fetch the file from GoPlay's own HTTP server
# (on a random port), so it needs an inbound rule on private networks. The
# MSIX declares the same rule in its manifest.
firewall = true

# The Microsoft Store package (giode build msix). The Store signs it.
# identity_name and publisher must match Partner Center → GoPlay →
# Product identity once the name is reserved (Package/Identity/Name and
# Package/Identity/Publisher); publisher_display_name is
# Package/Properties/PublisherDisplayName.
[windows.msix]
identity_name = "MehranZahir.GoPlay"
publisher = "CN=B40E8F57-A7E0-40BB-8E74-5D051D0B578B"
publisher_display_name = "Mehran Zahiroddini"

[linux]
categories = ["AudioVideo", "Video", "Player"]
description = "A video player built on mpv: hardware decoding, subtitles, 3D and 360° video, casting to Chromecast and DLNA."
maintainer = "Mehran <61628815+Mehran9675@users.noreply.github.com>"
license = "MIT"

[native]
bundle = true

[native.windows]
search = ["build/native", "$MSYSTEM_PREFIX/bin"]

[native.macos]
search = ["/opt/homebrew/lib", "/usr/local/lib"]

[native.linux]
system = true
deb_depends = ["libmpv2 | libmpv1"]
rpm_requires = ["mpv-libs"]

[[file_types]]
name = "Video"
extensions = ["mkv", "mk3d", "webm", "mp4", "m4v", "mov", "avi", "ts", "m2ts", "mts", "flv", "wmv", "mpg", "mpeg", "ogv", "vob", "3gp"]
mime_types = ["video/x-matroska", "video/webm", "video/mp4", "video/quicktime", "video/x-msvideo", "video/mp2t", "video/x-flv", "video/x-ms-wmv", "video/mpeg", "video/ogg", "video/3gpp"]

[[file_types]]
name = "Audio"
extensions = ["mp3", "flac", "ogg", "opus", "m4a", "aac", "wav", "wma"]
mime_types = ["audio/mpeg", "audio/flac", "audio/ogg", "audio/opus", "audio/mp4", "audio/aac", "audio/x-wav", "audio/x-ms-wma"]

[[context_actions]]
id = "play"
label = "Play with GoPlay"
extensions = [".mkv", ".mk3d", ".webm", ".mp4", ".m4v", ".mov", ".avi", ".ts", ".m2ts", ".mts", ".flv", ".wmv", ".mpg", ".mpeg", ".ogv", ".vob", ".3gp", ".mp3", ".flac", ".ogg", ".opus", ".m4a", ".aac", ".wav", ".wma"]
folders = true
