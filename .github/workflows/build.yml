name: Release builds

# Builds GoPlay with the giode CLI for macOS, Linux and Windows on
# Intel/AMD and ARM when a release is published, and attaches the
# packages to it. A manual run with a tag builds that release again;
# without one it builds the chosen branch and keeps the packages as the
# run's artifacts.
#
# Hand-written rather than made by `giode ci`: libmpv comes from Homebrew,
# apt and shinchiro's Windows builds, and the tests need generated media.
# The store packages follow `giode ci`'s steps and secret names: the
# Microsoft Store .msix (Windows jobs), and the Mac App Store .pkg and a
# Developer ID signed, notarized .dmg (macOS job) when the Apple secrets
# are set. See RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the packages to (empty to only build the branch)
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
  # The giode CLI takes the version from the tag (v1.2.3), for the
  # packages and GoPlay's own (giode.toml's app.ldflags {version}).
  GIODE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
  # The build number (CFBundleVersion) rises with every run, as each App
  # Store upload needs.
  GIODE_BUILD: ${{ github.run_number }}

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    # A hung signing or notarizing step fails in an hour rather than six.
    timeout-minutes: 90
    env:
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_STORE_CERT_BASE64: ${{ secrets.MACOS_STORE_CERT_BASE64 }}
      MACOS_INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
      MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libmpv, FFmpeg and the giode CLI
        run: |
          brew install mpv pkg-config ffmpeg
          # Homebrew's mpv.pc can name a Cellar folder that isn't there;
          # its stable prefix always is.
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          GOPROXY=direct go install github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1
      - name: Test
        run: |
          scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Developer ID certificate
        if: env.MACOS_CERT_BASE64 != ''
        env:
          MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
        run: |
          echo "$MACOS_CERT_BASE64" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Package
        env:
          # Signed with the certificate's Developer ID identity, and
          # notarized with these when they're set.
          GIODE_NOTARY_ID: ${{ secrets.GIODE_NOTARY_ID }}
          GIODE_NOTARY_TEAM_ID: ${{ secrets.GIODE_NOTARY_TEAM_ID }}
          GIODE_NOTARY_PASS: ${{ secrets.GIODE_NOTARY_PASS }}
        run: |
          release=""
          if [ -n "$MACOS_CERT_BASE64" ]; then release="-release"; fi
          giode build $release -arch arm64 dmg
      - name: Mac App Store certificates and profile
        if: env.MACOS_STORE_CERT_BASE64 != '' && env.MACOS_INSTALLER_CERT_BASE64 != '' && env.MACOS_PROFILE_BASE64 != ''
        env:
          MACOS_STORE_CERT_PASS: ${{ secrets.MACOS_STORE_CERT_PASS }}
          MACOS_INSTALLER_CERT_PASS: ${{ secrets.MACOS_INSTALLER_CERT_PASS }}
        run: |
          if ! security list-keychains -d user | grep -q build.keychain; then
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
          fi
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci build.keychain
          echo "$MACOS_STORE_CERT_BASE64" | base64 -d > store.p12
          echo "$MACOS_INSTALLER_CERT_BASE64" | base64 -d > installer.p12
          security import store.p12 -k build.keychain -P "$MACOS_STORE_CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import installer.p12 -k build.keychain -P "$MACOS_INSTALLER_CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm store.p12 installer.p12
          echo "$MACOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/store.provisionprofile"
          echo "GIODE_MACOS_STORE_PROFILE=$RUNNER_TEMP/store.provisionprofile" >> "$GITHUB_ENV"
      - name: Build for the Mac App Store
        if: env.GIODE_MACOS_STORE_PROFILE != ''
        run: giode build -arch arm64 mas
      - name: Collect
        run: scripts/ci-collect.sh macos arm64
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: goplay-macos-arm64
          path: out/*

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libmpv, FFmpeg, Gio's libraries and the giode CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg pkg-config gcc \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev
          GOPROXY=direct go install github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1
      - name: Test
        run: |
          scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: |
          giode build -arch ${{ matrix.arch }} linux deb rpm
          scripts/ci-collect.sh linux ${{ matrix.arch }}
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: goplay-linux-${{ matrix.arch }}
          path: out/*

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, mpv: x86_64, runner: windows-latest, msystem: UCRT64, pkg: mingw-w64-ucrt-x86_64, cc: gcc }
          - { arch: arm64, mpv: aarch64, runner: windows-11-arm, msystem: CLANGARM64, pkg: mingw-w64-clang-aarch64, cc: clang }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CGO_ENABLED: "1"
      # The toolchain's compiler (gcc in UCRT64, clang in CLANGARM64), not
      # another one on the inherited PATH.
      CC: cc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # The runner's own MSYS2, in C:\msys64 where giode.toml's
          # [native.windows] search looks.
          release: false
          path-type: inherit
          update: true
          install: >-
            zip
            ${{ matrix.pkg }}-${{ matrix.cc }}
            ${{ matrix.pkg }}-pkgconf
            ${{ matrix.pkg }}-ffmpeg
            ${{ matrix.pkg }}-angleproject
            mingw-w64-ucrt-x86_64-nsis
      - name: Get libmpv and the giode CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shinchiro's libmpv is one self-contained DLL. The CLI bundles
          # MSYS2's ANGLE (angleproject, above) and the DLLs it needs.
          set -x
          path_file="$(cygpath -u "$GITHUB_PATH")"
          mkdir -p build/native build/libmpv
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-${{ matrix.mpv }}-[0-9]*.7z" -D "$tmp"
          # MSYS2's p7zip is too old for these archives' filters; Windows'
          # own tar (libarchive) reads them.
          /c/Windows/System32/tar.exe -xf "$(cygpath -w "$(ls "$tmp"/mpv-dev-*.7z)")" -C "$(cygpath -w "$PWD/build/libmpv")"
          cp build/libmpv/libmpv-2.dll build/native/
          prefix="$(cygpath -m "$PWD/build/libmpv")"
          printf 'prefix=%s\nlibdir=${prefix}\nincludedir=${prefix}/include\n\nName: mpv\nDescription: libmpv\nVersion: 0.40.0\nLibs: -L${libdir} -lmpv\nCflags: -I${includedir}\n' "$prefix" > build/libmpv/mpv.pc
          # MSYS2's login profile sets PKG_CONFIG_PATH, so libmpv goes into
          # the toolchain's own folders, which are always searched (pkgconf
          # also takes the prefix from where the .pc file is).
          cp -r build/libmpv/include/mpv "$MINGW_PREFIX/include/"
          cp build/libmpv/libmpv.dll.a "$MINGW_PREFIX/lib/"
          cp build/libmpv/mpv.pc "$MINGW_PREFIX/lib/pkgconfig/"
          echo "$(cygpath -w "$PWD/build/native")" >> "$path_file"
          echo "C:\\msys64\\ucrt64\\bin" >> "$path_file"
          GOPROXY=direct go install github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1
      - name: Test
        run: |
          export PATH="$PWD/build/native:$PATH"
          scripts/test-media.sh "$RUNNER_TEMP/media"
          go vet ./...
          GOPLAY_TEST_MEDIA="$RUNNER_TEMP/media/chapters.mkv" GOPLAY_TEST_MEDIA_DIR="$RUNNER_TEMP/media" go test ./...
      - name: Package
        run: |
          export PATH="$PATH:/c/msys64/ucrt64/bin"
          giode build -arch ${{ matrix.arch }} windows windows-installer msix
          # Stops the release rather than ship a player that can't start.
          scripts/ci-check-dlls.sh
          scripts/ci-collect.sh windows ${{ matrix.arch }}
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: goplay-windows-${{ matrix.arch }}
          path: out/*
